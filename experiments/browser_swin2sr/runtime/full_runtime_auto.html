<!doctype html>
<meta charset="utf-8">
<title>BackdropKit adaptive packed Swin2SR WASM conformance</title>
<pre id="result">running</pre>
<script type="module">
  import { loadPackedSwinRuntime } from "./packedRuntime.js";

  const result = document.querySelector("#result");
  const parameters = new URLSearchParams(location.search);
  const artifactRoot = parameters.get("artifact");
  const fixtureUrl = parameters.get("fixture");

  function errors(actual, expected) {
    let maximum = 0;
    let total = 0;
    for (let index = 0; index < expected.length; index += 1) {
      const error = Math.abs(actual[index] - expected[index]);
      maximum = Math.max(maximum, error);
      total += error;
    }
    return { maximum, mean: total / expected.length };
  }

  try {
    const loadStarted = performance.now();
    const [runtime, manifest, blob, fixture] = await Promise.all([
      loadPackedSwinRuntime({ allowSimd: parameters.get("simd") !== "0" }),
      fetch(`${artifactRoot}/model.json`).then((response) => response.arrayBuffer()),
      fetch(`${artifactRoot}/model.bin`).then((response) => response.arrayBuffer()),
      fetch(fixtureUrl).then((response) => response.json()),
    ]);
    const loadMs = performance.now() - loadStarted;
    const started = performance.now();
    const output = runtime.swin2srX2(
      new Uint8Array(manifest),
      new Uint8Array(blob),
      new Float32Array(fixture.input),
      fixture.input_shape[2],
      fixture.input_shape[3],
    );
    const receipt = {
      backend: runtime.backend,
      artifactBytes: manifest.byteLength + blob.byteLength,
      loadMs,
      inferenceMs: performance.now() - started,
      errors: errors(output, fixture.expected),
      outputShape: fixture.output_shape,
    };
    window.__backdropkitRuntimeReceipt = receipt;
    result.textContent = JSON.stringify(receipt, null, 2);
    result.dataset.status = "complete";
  } catch (error) {
    window.__backdropkitRuntimeReceipt = { error: String(error?.stack ?? error) };
    result.textContent = String(error?.stack ?? error);
    result.dataset.status = "failed";
  }
</script>
