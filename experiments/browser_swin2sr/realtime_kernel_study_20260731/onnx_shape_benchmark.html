<!doctype html>
<meta charset="utf-8">
<title>Clark Swin2SR ONNX shape benchmark</title>
<pre id="result">running</pre>
<script type="module">
  const result = document.querySelector("#result");
  const parameters = new URLSearchParams(location.search);
  const ortUrl = parameters.get("ort")
    ?? "/Documents/git/clark/saas-products/backdrop/node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs";
  const wasmRoot = parameters.get("wasm")
    ?? "/Documents/git/clark/saas-products/backdrop/node_modules/onnxruntime-web/dist/";
  const modelUrl = parameters.get("model")
    ?? "/Documents/git/clark/saas-products/backdrop/public/models/swin2sr-ternary-g2/model.bin";
  const backend = parameters.get("backend") ?? "webgpu";
  const sizes = (parameters.get("sizes") ?? "32,64,96,128,192,256")
    .split(",")
    .map(Number)
    .filter((value) => Number.isInteger(value) && value >= 8 && value % 8 === 0);
  const measuredRuns = Math.max(1, Number(parameters.get("runs") ?? 5));
  const warmupRuns = Math.max(1, Number(parameters.get("warmup") ?? 2));
  const graphCapture = parameters.get("capture") === "1";
  const staticShape = graphCapture || parameters.get("static") === "1";
  const profile = parameters.get("profile") === "1";
  const profileEvents = [];

  function median(values) {
    const sorted = [...values].sort((left, right) => left - right);
    return sorted[Math.floor(sorted.length / 2)];
  }

  function percentile(values, fraction) {
    const sorted = [...values].sort((left, right) => left - right);
    return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * fraction) - 1)];
  }

  function heapBytes() {
    return Number.isFinite(performance.memory?.usedJSHeapSize)
      ? performance.memory.usedJSHeapSize
      : null;
  }

  function inputFor(size) {
    const plane = size * size;
    const input = new Float32Array(plane * 3);
    for (let channel = 0; channel < 3; channel += 1) {
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const checker = ((x >> 2) + (y >> 2) + channel) & 1;
          const edge = (x % 17 === 0 || y % 13 === 0) ? .28 : 0;
          input[channel * plane + y * size + x] = Math.min(
            1,
            .12 + checker * .52 + edge + ((x * 7 + y * 11 + channel * 3) % 19) / 190,
          );
        }
      }
    }
    return input;
  }

  async function decompressGzip(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function createSession(ort, modelBytes, size = null) {
    const options = {
      executionProviders: [backend],
      graphOptimizationLevel: "all",
    };
    if (size !== null) {
      options.freeDimensionOverrides = {
        batch_size: 1,
        num_channels: 3,
        height: size,
        width: size,
      };
    }
    if (graphCapture) options.enableGraphCapture = true;
    const started = performance.now();
    const session = await ort.InferenceSession.create(modelBytes, options);
    return { session, sessionMs: performance.now() - started };
  }

  async function benchmarkSize(ort, modelBytes, size, sharedSession) {
    const owned = sharedSession ?? await createSession(ort, modelBytes, size);
    const inputValues = inputFor(size);
    const input = new ort.Tensor("float32", inputValues, [1, 3, size, size]);
    let output;
    for (let index = 0; index < warmupRuns; index += 1) {
      output = await owned.session.run({ pixel_values: input });
    }
    const timings = [];
    for (let index = 0; index < measuredRuns; index += 1) {
      const started = performance.now();
      output = await owned.session.run({ pixel_values: input });
      timings.push(performance.now() - started);
    }
    const reconstruction = output.reconstruction;
    const sampleStride = Math.max(1, Math.floor(reconstruction.data.length / 257));
    let checksum = 0;
    for (let index = 0; index < reconstruction.data.length; index += sampleStride) {
      checksum += reconstruction.data[index] * (index + 1);
    }
    const medianMs = median(timings);
    const inputPixels = size * size;
    const megapixelsPerSecond = inputPixels / medianMs / 1000;
    const linear1080pFrameMs = medianMs * (1920 * 1080) / inputPixels;
    input.dispose?.();
    reconstruction.dispose?.();
    if (!sharedSession) await owned.session.release?.();
    return {
      checksum,
      heapBytes: heapBytes(),
      inputPixels,
      inputShape: [1, 3, size, size],
      linear1080pEstimate: {
        framesPerSecond: 1000 / linear1080pFrameMs,
        millisecondsPerFrame: linear1080pFrameMs,
      },
      medianMs,
      megapixelsPerSecond,
      outputShape: [1, 3, size * 2, size * 2],
      p95Ms: percentile(timings, .95),
      sessionMs: sharedSession ? null : owned.sessionMs,
      timingsMs: timings,
    };
  }

  try {
    if (!sizes.length) throw new Error("No valid benchmark sizes were requested.");
    const ort = await import(ortUrl);
    ort.env.wasm.wasmPaths = wasmRoot;
    ort.env.wasm.numThreads = Number(parameters.get("threads") ?? 1);
    if (profile && backend === "webgpu") {
      ort.env.webgpu.profiling = {
        mode: "default",
        ondata: (data) => {
          if (profileEvents.length < 2000) profileEvents.push(data);
        },
      };
    }
    const adapter = backend === "webgpu" && navigator.gpu
      ? await navigator.gpu.requestAdapter({ powerPreference: "high-performance" })
      : null;
    const compressed = new Uint8Array(
      await fetch(modelUrl, { cache: "no-store" }).then((response) => response.arrayBuffer()),
    );
    const decompressionStarted = performance.now();
    const modelBytes = await decompressGzip(compressed);
    const decompressionMs = performance.now() - decompressionStarted;
    const sharedSession = staticShape ? null : await createSession(ort, modelBytes);
    const cases = [];
    for (const size of sizes) {
      cases.push(await benchmarkSize(ort, modelBytes, size, sharedSession));
    }
    if (sharedSession) await sharedSession.session.release?.();
    const receipt = {
      adapter: adapter ? {
        features: [...adapter.features].sort(),
        isFallbackAdapter: adapter.isFallbackAdapter ?? null,
        limits: {
          maxComputeInvocationsPerWorkgroup: adapter.limits.maxComputeInvocationsPerWorkgroup,
          maxComputeWorkgroupStorageSize: adapter.limits.maxComputeWorkgroupStorageSize,
          maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        },
      } : null,
      backend,
      cases,
      compressedModelBytes: compressed.byteLength,
      decompressionMs,
      expandedModelBytes: modelBytes.byteLength,
      graphCapture,
      navigatorGpu: Boolean(navigator.gpu),
      profileEventCount: profileEvents.length,
      profileEvents,
      runs: measuredRuns,
      sharedSessionMs: sharedSession?.sessionMs ?? null,
      staticShape,
      userAgent: navigator.userAgent,
      warmupRuns,
    };
    window.__clarkSwinBenchmark = receipt;
    result.textContent = JSON.stringify(receipt, null, 2);
    result.dataset.status = "complete";
  } catch (error) {
    window.__clarkSwinBenchmark = { error: String(error?.stack ?? error) };
    result.textContent = String(error?.stack ?? error);
    result.dataset.status = "failed";
  }
</script>
