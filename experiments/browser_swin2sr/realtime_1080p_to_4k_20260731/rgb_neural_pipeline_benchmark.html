<!doctype html>
<meta charset="utf-8">
<title>BackdropKit RGB neural 1080p to 4K pipeline benchmark</title>
<style>body{font:14px ui-monospace,monospace;margin:16px}video{display:none}canvas{display:block;width:min(960px,100%);height:auto}</style>
<pre id="result">running</pre>
<video id="source" muted playsinline loop></video>
<canvas id="output" width="3840" height="2160"></canvas>
<script type="module">
  const result = document.querySelector("#result");
  const video = document.querySelector("#source");
  const canvas = document.querySelector("#output");
  const parameters = new URLSearchParams(location.search);
  const sourceUrl = parameters.get("video") ??
    "/Documents/git/clark-quantize/experiments/browser_swin2sr/" +
    "realtime_1080p_to_4k_20260731/assets/synthetic_product_demo_1080p60.mp4";
  const channels = Math.max(4, Number(parameters.get("channels") ?? 12));
  const layers = Math.max(1, Number(parameters.get("layers") ?? 6));
  const fusion = parameters.get("fusion") === "1";
  const warmupFrames = Math.max(1, Number(parameters.get("warmup") ?? 15));
  const measuredFrames = Math.max(1, Number(parameters.get("frames") ?? 120));
  const encodeRequested = parameters.get("encode") === "1";
  const targetFps = Math.max(1, Math.min(60, Number(parameters.get("fps") ?? 60)));
  const frameDurationUs = Math.round(1_000_000 / targetFps);
  const residualScale = Number(parameters.get("residualScale") ?? 1);
  const modelUrl = parameters.get("model");
  const workWidth = 960;
  const workHeight = 540;

  function percentile(values, fraction) {
    const sorted = [...values].sort((left, right) => left - right);
    return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * fraction) - 1)];
  }
  function median(values) { return percentile(values, .5); }

  function f32ToF16(value) {
    const float = new Float32Array(1);
    const bits = new Uint32Array(float.buffer);
    float[0] = value;
    const x = bits[0];
    const sign = (x >>> 16) & 0x8000;
    let exponent = ((x >>> 23) & 0xff) - 127 + 15;
    let mantissa = x & 0x7fffff;
    if (exponent <= 0) {
      if (exponent < -10) return sign;
      mantissa = (mantissa | 0x800000) >>> (1 - exponent);
      return sign | ((mantissa + 0x1000) >>> 13);
    }
    if (exponent >= 31) return sign | 0x7c00;
    return sign | (exponent << 10) | ((mantissa + 0x1000) >>> 13);
  }

  function f16Values(length, generator) {
    return Uint16Array.from({ length }, (_, index) => f32ToF16(generator(index)));
  }

  function bufferWithData(device, values, usage) {
    const size = Math.max(16, Math.ceil(values.byteLength / 4) * 4);
    const buffer = device.createBuffer({ size, usage, mappedAtCreation: true });
    new Uint8Array(buffer.getMappedRange()).set(
      new Uint8Array(values.buffer, values.byteOffset, values.byteLength),
    );
    buffer.unmap();
    return buffer;
  }

  async function chooseEncoder() {
    if (!encodeRequested || !("VideoEncoder" in window)) return null;
    const candidates = [
      { codec: "avc1.640033", avc: { format: "annexb" } },
      { codec: "vp09.00.51.08" },
      { codec: "av01.0.12M.08" },
    ];
    for (const candidate of candidates) {
      const config = {
        ...candidate,
        width: 3840,
        height: 2160,
        bitrate: 20_000_000,
        framerate: targetFps,
        hardwareAcceleration: "prefer-hardware",
        latencyMode: "realtime",
      };
      try {
        const support = await VideoEncoder.isConfigSupported(config);
        if (support.supported) return support.config;
      } catch {}
    }
    return null;
  }

  const inputShader = /* wgsl */ `
    enable f16;
    struct Dimensions { width: u32, height: u32, channels: u32, padding: u32 }
    @group(0) @binding(0) var source: texture_external;
    @group(0) @binding(1) var source_sampler: sampler;
    @group(0) @binding(2) var<storage, read_write> output: array<f16>;
    @group(0) @binding(3) var<storage, read> weights: array<f16>;
    @group(0) @binding(4) var<uniform> dimensions: Dimensions;

    @compute @workgroup_size(8, 8, 1)
    fn main(@builtin(global_invocation_id) id: vec3<u32>) {
      if (id.x >= dimensions.width || id.y >= dimensions.height) { return; }
      let source_size = vec2<f32>(1920.0, 1080.0);
      let base = vec2<f32>(f32(id.x * 2u), f32(id.y * 2u));
      let p0 = textureSampleBaseClampToEdge(source, source_sampler, (base + vec2<f32>(0.5, 0.5)) / source_size).rgb;
      let p1 = textureSampleBaseClampToEdge(source, source_sampler, (base + vec2<f32>(1.5, 0.5)) / source_size).rgb;
      let p2 = textureSampleBaseClampToEdge(source, source_sampler, (base + vec2<f32>(0.5, 1.5)) / source_size).rgb;
      let p3 = textureSampleBaseClampToEdge(source, source_sampler, (base + vec2<f32>(1.5, 1.5)) / source_size).rgb;
      let pixels = array<f32, 12>(
        p0.r, p1.r, p2.r, p3.r,
        p0.g, p1.g, p2.g, p3.g,
        p0.b, p1.b, p2.b, p3.b,
      );
      for (var channel = 0u; channel < dimensions.channels; channel += 1u) {
        let offset = channel * 12u;
        var value = 0.0;
        for (var input_channel = 0u; input_channel < 12u; input_channel += 1u) {
          value += pixels[input_channel] * f32(weights[offset + input_channel]);
        }
        output[(id.y * dimensions.width + id.x) * dimensions.channels + channel] = f16(max(value, 0.0));
      }
    }
  `;

  const convolutionShader = /* wgsl */ `
    enable f16;
    struct Dimensions { width: u32, height: u32, channels: u32, padding: u32 }
    @group(0) @binding(0) var<storage, read> input: array<f16>;
    @group(0) @binding(1) var<storage, read> weights: array<f16>;
    @group(0) @binding(2) var<storage, read_write> output: array<f16>;
    @group(0) @binding(3) var<uniform> dimensions: Dimensions;

    @compute @workgroup_size(8, 8, 1)
    fn main(@builtin(global_invocation_id) id: vec3<u32>) {
      let x = id.x;
      let y = id.y;
      let output_channel = id.z;
      if (x >= dimensions.width || y >= dimensions.height || output_channel >= dimensions.channels) { return; }
      var sum = 0.0h;
      for (var kernel_y = 0u; kernel_y < 3u; kernel_y += 1u) {
        let source_y = clamp(i32(y) + i32(kernel_y) - 1, 0, i32(dimensions.height) - 1);
        for (var kernel_x = 0u; kernel_x < 3u; kernel_x += 1u) {
          let source_x = clamp(i32(x) + i32(kernel_x) - 1, 0, i32(dimensions.width) - 1);
          for (var input_channel = 0u; input_channel < dimensions.channels; input_channel += 1u) {
            let input_index = (u32(source_y) * dimensions.width + u32(source_x)) * dimensions.channels + input_channel;
            let weight_index = ((output_channel * 3u + kernel_y) * 3u + kernel_x) * dimensions.channels + input_channel;
            sum += input[input_index] * weights[weight_index];
          }
        }
      }
      output[(y * dimensions.width + x) * dimensions.channels + output_channel] = max(sum, 0.0h);
    }
  `;

  const tileSize = 8;
  const inputTileSize = tileSize + 4;
  const intermediateTileSize = tileSize + 2;
  const inputTileElements = inputTileSize * inputTileSize * channels;
  const intermediateTileElements = intermediateTileSize * intermediateTileSize * channels;
  const weightsPerConvolution = 9 * channels * channels;
  const fusedConvolutionShader = /* wgsl */ `
    enable f16;
    struct Dimensions { width: u32, height: u32, channels: u32, padding: u32 }
    @group(0) @binding(0) var<storage, read> input: array<f16>;
    @group(0) @binding(1) var<storage, read> weights: array<f16>;
    @group(0) @binding(2) var<storage, read_write> output: array<f16>;
    @group(0) @binding(3) var<uniform> dimensions: Dimensions;
    var<workgroup> input_tile: array<f16, ${inputTileElements}>;
    var<workgroup> intermediate_tile: array<f16, ${intermediateTileElements}>;

    fn input_index(x: u32, y: u32, channel: u32) -> u32 {
      return (y * ${inputTileSize}u + x) * ${channels}u + channel;
    }
    fn intermediate_index(x: u32, y: u32, channel: u32) -> u32 {
      return (y * ${intermediateTileSize}u + x) * ${channels}u + channel;
    }
    fn weight_index(output_channel: u32, kernel_x: u32, kernel_y: u32, input_channel: u32) -> u32 {
      return ((output_channel * 3u + kernel_y) * 3u + kernel_x) * ${channels}u + input_channel;
    }

    @compute @workgroup_size(${tileSize}, ${tileSize}, 1)
    fn main(
      @builtin(workgroup_id) group: vec3<u32>,
      @builtin(local_invocation_index) lane: u32,
      @builtin(local_invocation_id) local: vec3<u32>,
    ) {
      let base_x = i32(group.x * ${tileSize}u);
      let base_y = i32(group.y * ${tileSize}u);
      for (var linear = lane; linear < ${inputTileElements}u; linear += ${tileSize * tileSize}u) {
        let channel = linear % ${channels}u;
        let pixel = linear / ${channels}u;
        let tile_x = pixel % ${inputTileSize}u;
        let tile_y = pixel / ${inputTileSize}u;
        let source_x = clamp(base_x + i32(tile_x) - 2, 0, i32(dimensions.width) - 1);
        let source_y = clamp(base_y + i32(tile_y) - 2, 0, i32(dimensions.height) - 1);
        input_tile[linear] = input[(u32(source_y) * dimensions.width + u32(source_x)) * ${channels}u + channel];
      }
      workgroupBarrier();

      for (var linear = lane; linear < ${intermediateTileElements}u; linear += ${tileSize * tileSize}u) {
        let output_channel = linear % ${channels}u;
        let pixel = linear / ${channels}u;
        let tile_x = pixel % ${intermediateTileSize}u;
        let tile_y = pixel / ${intermediateTileSize}u;
        var sum = 0.0h;
        for (var kernel_y = 0u; kernel_y < 3u; kernel_y += 1u) {
          for (var kernel_x = 0u; kernel_x < 3u; kernel_x += 1u) {
            for (var input_channel = 0u; input_channel < ${channels}u; input_channel += 1u) {
              sum += input_tile[input_index(tile_x + kernel_x, tile_y + kernel_y, input_channel)]
                * weights[weight_index(output_channel, kernel_x, kernel_y, input_channel)];
            }
          }
        }
        intermediate_tile[linear] = max(sum, 0.0h);
      }
      workgroupBarrier();

      let output_x = group.x * ${tileSize}u + local.x;
      let output_y = group.y * ${tileSize}u + local.y;
      if (output_x >= dimensions.width || output_y >= dimensions.height) { return; }
      for (var output_channel = 0u; output_channel < ${channels}u; output_channel += 1u) {
        var sum = 0.0h;
        for (var kernel_y = 0u; kernel_y < 3u; kernel_y += 1u) {
          for (var kernel_x = 0u; kernel_x < 3u; kernel_x += 1u) {
            for (var input_channel = 0u; input_channel < ${channels}u; input_channel += 1u) {
              sum += intermediate_tile[intermediate_index(local.x + kernel_x, local.y + kernel_y, input_channel)]
                * weights[${weightsPerConvolution}u + weight_index(output_channel, kernel_x, kernel_y, input_channel)];
            }
          }
        }
        let residual = input_tile[input_index(local.x + 2u, local.y + 2u, output_channel)];
        output[(output_y * dimensions.width + output_x) * ${channels}u + output_channel] = max(sum + residual, 0.0h);
      }
    }
  `;

  const outputShader = /* wgsl */ `
    enable f16;
    struct Dimensions { width: u32, height: u32, channels: u32, padding: u32 }
    @group(0) @binding(0) var source: texture_external;
    @group(0) @binding(1) var source_sampler: sampler;
    @group(0) @binding(2) var<storage, read> features: array<f16>;
    @group(0) @binding(3) var<storage, read> weights: array<f16>;
    @group(0) @binding(4) var<uniform> dimensions: Dimensions;

    @vertex
    fn vertex_main(@builtin(vertex_index) index: u32) -> @builtin(position) vec4<f32> {
      let position = array<vec2<f32>, 3>(
        vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0)
      );
      return vec4<f32>(position[index], 0.0, 1.0);
    }

    @fragment
    fn fragment_main(@builtin(position) position: vec4<f32>) -> @location(0) vec4<f32> {
      let output_pixel = vec2<u32>(position.xy);
      let work_pixel = output_pixel / 4u;
      let subpixel = (output_pixel.y % 4u) * 4u + output_pixel.x % 4u;
      let feature_offset = (work_pixel.y * dimensions.width + work_pixel.x) * dimensions.channels;
      var residual = vec3<f32>(0.0);
      for (var color_channel = 0u; color_channel < 3u; color_channel += 1u) {
        let weight_offset = (color_channel * 16u + subpixel) * dimensions.channels;
        var correction = 0.0;
        for (var channel = 0u; channel < dimensions.channels; channel += 1u) {
          correction += f32(features[feature_offset + channel]) * f32(weights[weight_offset + channel]);
        }
        residual[color_channel] = correction;
      }
      let uv = position.xy / vec2<f32>(3840.0, 2160.0);
      let base = textureSampleBaseClampToEdge(source, source_sampler, uv).rgb;
      return vec4<f32>(clamp(base + residual * ${residualScale}, vec3<f32>(0.0), vec3<f32>(1.0)), 1.0);
    }
  `;

  async function compiledModule(device, code) {
    const module = device.createShaderModule({ code });
    const compilation = await module.getCompilationInfo();
    const errors = compilation.messages.filter((message) => message.type === "error");
    if (errors.length) throw new Error(errors.map((message) => message.message).join("\n"));
    return module;
  }

  try {
    if (!navigator.gpu) throw new Error("WebGPU is unavailable.");
    if (fusion && layers % 2 !== 0) throw new Error("Fused execution requires an even layer count.");
    video.src = sourceUrl;
    await new Promise((resolve, reject) => {
      video.addEventListener("loadeddata", resolve, { once: true });
      video.addEventListener("error", () => reject(video.error ?? new Error("video load failed")), { once: true });
    });
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
    if (!adapter?.features.has("shader-f16")) throw new Error("shader-f16 is unavailable.");
    const device = await adapter.requestDevice({ requiredFeatures: ["shader-f16"] });
    const context = canvas.getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: "opaque" });
    const sampler = device.createSampler({ magFilter: "linear", minFilter: "linear" });
    const usage = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
    const featureBytes = workWidth * workHeight * channels * 2;
    const first = device.createBuffer({ size: featureBytes, usage });
    const second = device.createBuffer({ size: featureBytes, usage });
    const dimensions = bufferWithData(
      device,
      new Uint32Array([workWidth, workHeight, channels, 0]),
      GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    );
    if (modelUrl && !fusion) throw new Error("Trained payloads require fused execution.");
    const modelPayload = modelUrl ? await (await fetch(modelUrl)).arrayBuffer() : null;
    let modelOffset = 0;
    function modelValues(elements, fallback) {
      if (!modelPayload) return f16Values(elements, fallback);
      const values = new Uint16Array(modelPayload, modelOffset, elements).slice();
      modelOffset += elements * 2;
      return values;
    }
    const inputWeights = bufferWithData(
      device,
      modelValues(channels * 12, (index) => ((index * 7) % 13 - 6) / 16),
      GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    );
    const convolutionStages = fusion ? layers / 2 : layers;
    const convolutionWeights = Array.from({ length: convolutionStages }, (_, stage) => bufferWithData(
      device,
      modelValues(9 * channels * channels * (fusion ? 2 : 1),
        (index) => ((index * 29 + stage * 11) % 17 - 8) / (channels * 24)),
      GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    ));
    const outputWeights = bufferWithData(
      device,
      modelValues(48 * channels, (index) => ((index * 19) % 13 - 6) / (channels * 8)),
      GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    );
    const inputModule = await compiledModule(device, inputShader);
    const convolutionModule = await compiledModule(device, fusion ? fusedConvolutionShader : convolutionShader);
    const outputModule = await compiledModule(device, outputShader);
    const inputPipeline = await device.createComputePipelineAsync({ layout: "auto", compute: { module: inputModule, entryPoint: "main" } });
    const convolutionPipeline = await device.createComputePipelineAsync({ layout: "auto", compute: { module: convolutionModule, entryPoint: "main" } });
    const outputPipeline = await device.createRenderPipelineAsync({
      layout: "auto",
      vertex: { module: outputModule, entryPoint: "vertex_main" },
      fragment: { module: outputModule, entryPoint: "fragment_main", targets: [{ format }] },
      primitive: { topology: "triangle-list" },
    });
    const encoderConfig = await chooseEncoder();
    const encodeEnqueue = new Map();
    const encodeLatencies = [];
    let encodedBytes = 0;
    let outputChunks = 0;
    let encoderError = null;
    let maxEncodeQueue = 0;
    const encoder = encoderConfig ? new VideoEncoder({
      output: (chunk) => {
        encodedBytes += chunk.byteLength;
        outputChunks += 1;
        const queuedAt = encodeEnqueue.get(chunk.timestamp);
        if (queuedAt !== undefined) {
          encodeLatencies.push(performance.now() - queuedAt);
          encodeEnqueue.delete(chunk.timestamp);
        }
      },
      error: (error) => { encoderError = String(error?.stack ?? error); },
    }) : null;
    encoder?.configure(encoderConfig);
    const convolutionGroups = convolutionWeights.map((weights, stage) => {
      const source = stage & 1 ? second : first;
      const target = stage & 1 ? first : second;
      return device.createBindGroup({
        layout: convolutionPipeline.getBindGroupLayout(0),
        entries: [source, weights, target, dimensions].map((buffer, binding) => ({ binding, resource: { buffer } })),
      });
    });
    const finalFeatures = convolutionStages & 1 ? second : first;
    const timings = [];
    const callbackIntervals = [];
    const mediaIntervals = [];
    let previousCallback = null;
    let previousMediaTime = null;
    let presentedFramesStart = null;
    let presentedFramesEnd = null;
    let callbackCount = 0;
    let observedCallbacks = 0;
    let cadenceFrameSkips = 0;
    let busyFrameSkips = 0;
    let processed = 0;

    async function renderFrame(now, metadata) {
      if (previousCallback !== null) callbackIntervals.push(now - previousCallback);
      if (previousMediaTime !== null) mediaIntervals.push((metadata.mediaTime - previousMediaTime) * 1000);
      previousCallback = now;
      previousMediaTime = metadata.mediaTime;
      presentedFramesStart ??= metadata.presentedFrames;
      presentedFramesEnd = metadata.presentedFrames;
      callbackCount += 1;
      const started = performance.now();
      const external = device.importExternalTexture({ source: video });
      const inputGroup = device.createBindGroup({
        layout: inputPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: external },
          { binding: 1, resource: sampler },
          { binding: 2, resource: { buffer: first } },
          { binding: 3, resource: { buffer: inputWeights } },
          { binding: 4, resource: { buffer: dimensions } },
        ],
      });
      const outputGroup = device.createBindGroup({
        layout: outputPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: external },
          { binding: 1, resource: sampler },
          { binding: 2, resource: { buffer: finalFeatures } },
          { binding: 3, resource: { buffer: outputWeights } },
          { binding: 4, resource: { buffer: dimensions } },
        ],
      });
      const command = device.createCommandEncoder();
      const compute = command.beginComputePass();
      compute.setPipeline(inputPipeline);
      compute.setBindGroup(0, inputGroup);
      compute.dispatchWorkgroups(Math.ceil(workWidth / 8), Math.ceil(workHeight / 8));
      compute.setPipeline(convolutionPipeline);
      for (const group of convolutionGroups) {
        compute.setBindGroup(0, group);
        compute.dispatchWorkgroups(
          Math.ceil(workWidth / 8),
          Math.ceil(workHeight / 8),
          fusion ? 1 : channels,
        );
      }
      compute.end();
      const render = command.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0, g: 0, b: 0, a: 1 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      render.setPipeline(outputPipeline);
      render.setBindGroup(0, outputGroup);
      render.draw(3);
      render.end();
      device.queue.submit([command.finish()]);
      await device.queue.onSubmittedWorkDone();
      if (encoder && processed >= warmupFrames) {
        const timestamp = (processed - warmupFrames) * frameDurationUs;
        const frame = new VideoFrame(canvas, { timestamp, duration: frameDurationUs });
        encodeEnqueue.set(timestamp, performance.now());
        encoder.encode(frame, { keyFrame: (processed - warmupFrames) % 120 === 0 });
        maxEncodeQueue = Math.max(maxEncodeQueue, encoder.encodeQueueSize);
        frame.close();
      }
      if (processed >= warmupFrames) timings.push(performance.now() - started);
      processed += 1;
    }

    await video.play();
    await new Promise((resolve, reject) => {
      let inFlight = false;
      let complete = false;
      let lastScheduledMediaTime = null;
      const onFrame = (now, metadata) => {
        if (complete) return;
        video.requestVideoFrameCallback(onFrame);
        observedCallbacks += 1;
        if (
          lastScheduledMediaTime !== null
          && metadata.mediaTime >= lastScheduledMediaTime
          && metadata.mediaTime - lastScheduledMediaTime < 1 / targetFps - 0.001
        ) {
          cadenceFrameSkips += 1;
          return;
        }
        lastScheduledMediaTime = metadata.mediaTime;
        if (inFlight) {
          busyFrameSkips += 1;
          return;
        }
        inFlight = true;
        renderFrame(now, metadata).then(() => {
          inFlight = false;
          if (timings.length >= measuredFrames && !complete) {
            complete = true;
            resolve();
          }
        }).catch(reject);
      };
      video.requestVideoFrameCallback(onFrame);
    });
    video.pause();
    const flushStarted = performance.now();
    if (encoder) await encoder.flush();
    const encodeFlushMs = performance.now() - flushStarted;
    const convolutionMacs = workWidth * workHeight * layers * channels * channels * 9;
    const edgeMacs = workWidth * workHeight * channels * 12
      + workWidth * workHeight * 48 * channels;
    const medianMs = median(timings);
    const receipt = {
      adapter: { features: [...adapter.features].sort() },
      input: { width: video.videoWidth, height: video.videoHeight, fps: 60 },
      output: { width: canvas.width, height: canvas.height },
      workingGrid: { width: workWidth, height: workHeight },
      architecture: {
        channels,
        layers,
        precision: "f16",
        rgbPixelUnshuffle: 2,
        outputPixelShuffle: 4,
        fusion: fusion ? "two-convolution workgroup-fused residual blocks" : "none",
      },
      measuredFrames,
      warmupFrames,
      targetFps,
      residualScale,
      model: modelUrl ? { url: modelUrl, bytes: modelPayload.byteLength } : null,
      convolutionGmacs: convolutionMacs / 1e9,
      edgeProjectionGmacs: edgeMacs / 1e9,
      approximateTotalGmacs: (convolutionMacs + edgeMacs) / 1e9,
      residentFeatureBytes: featureBytes * 2,
      medianMs,
      p95Ms: percentile(timings, .95),
      maximumMs: Math.max(...timings),
      framesPerSecondFromMedian: 1000 / medianMs,
      callbackMedianMs: median(callbackIntervals.slice(warmupFrames)),
      callbackP95Ms: percentile(callbackIntervals.slice(warmupFrames), .95),
      decodedFrameCallbacks: {
        callbacks: callbackCount,
        observedCallbacks,
        presentedFrames: presentedFramesStart === null ? 0 : presentedFramesEnd - presentedFramesStart + 1,
        cadenceFrameSkips,
        busyFrameSkips,
        medianMediaIntervalMs: median(mediaIntervals.slice(warmupFrames)),
      },
      encode: {
        requested: encodeRequested,
        supportedConfig: encoderConfig,
        error: encoderError,
        encodedBytes,
        outputChunks,
        medianLatencyMs: encodeLatencies.length ? median(encodeLatencies) : null,
        p95LatencyMs: encodeLatencies.length ? percentile(encodeLatencies, .95) : null,
        flushMs: encodeFlushMs,
        maximumQueue: maxEncodeQueue,
        remainingQueue: encoder?.encodeQueueSize ?? null,
      },
      timingsMs: timings,
    };
    encoder?.close();
    window.__backdropOutputFrame = canvas.toDataURL("image/png");
    window.__backdropNeuralPipelineBenchmark = receipt;
    result.textContent = JSON.stringify(receipt, null, 2);
    result.dataset.status = "complete";
  } catch (error) {
    window.__backdropNeuralPipelineBenchmark = { error: String(error?.stack ?? error) };
    result.textContent = String(error?.stack ?? error);
    result.dataset.status = "failed";
  }
</script>
